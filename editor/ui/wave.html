<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卫戍协议 · 工坊出怪设计器</title>
<style>
  :root { color-scheme: dark; --bg:#16181d; --panel:#1e2128; --line:#2e333d; --fg:#e8eaf0; --dim:#9aa3b2; --acc:#5b9dff; --ok:#4ec98a; --warn:#e0b357; --err:#f0736b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.6 "Segoe UI", system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  header h1 { font-size:14px; margin:0; font-weight:600; }
  a { color:var(--acc); }
  main { display:grid; grid-template-columns:250px 1fr 320px; height:calc(100vh - 47px); }
  aside, .side, .center { overflow:auto; }
  aside { border-right:1px solid var(--line); }
  .side { border-left:1px solid var(--line); padding:12px 14px 60px; }
  .center { padding:14px 16px 60px; }
  h2 { font-size:12px; margin:16px 0 8px; color:var(--dim); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  h2:first-child { margin-top:0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  label { display:block; font-size:12px; color:var(--dim); margin-bottom:2px; }
  input, select, textarea, button { font:inherit; color:var(--fg); background:#12141a; border:1px solid var(--line); border-radius:5px; padding:4px 7px; width:100%; }
  textarea { min-height:56px; font-family:ui-monospace, monospace; font-size:12px; }
  button { width:auto; cursor:pointer; background:#262b34; }
  button:hover { border-color:var(--acc); }
  button.primary { background:var(--acc); border-color:var(--acc); color:#08111f; font-weight:600; }
  button.ghost { background:transparent; }
  .item { padding:7px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:hover { background:#232833; }
  .item.on { background:#22304a; }
  .item .n { font-weight:600; }
  .item .m { color:var(--dim); font-size:12px; }
  .tag { display:inline-block; font-size:11px; padding:0 6px; border-radius:9px; border:1px solid var(--line); color:var(--dim); }
  .tag.err { color:var(--err); border-color:#5f312e; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:10px 12px; margin:10px 0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .err { color:var(--err); } .warn { color:var(--warn); } .ok { color:var(--ok); } .dim { color:var(--dim); }
  .banner { padding:7px 11px; border-radius:6px; margin-bottom:8px; }
  .banner.bad { background:#3a1f1e; border:1px solid #5f312e; }
  .banner.good { background:#1c3229; border:1px solid #2c5a44; }
  .hint { color:var(--dim); font-size:12px; }
  canvas { background:#0f1116; border:1px solid var(--line); border-radius:6px; display:block; }
  /* the timeline: one lane per spawn, time on the x axis */
  .tl { position:relative; background:#12141a; border:1px solid var(--line); border-radius:6px; padding:0; overflow:hidden; }
  .tick { position:absolute; top:0; bottom:0; border-left:1px solid #ffffff14; }
  .tick span { position:absolute; top:2px; left:3px; font-size:10px; color:var(--dim); }
  .lane { position:relative; height:26px; border-top:1px solid #ffffff0d; }
  .lane:hover { background:#ffffff06; }
  .blk { position:absolute; top:3px; height:20px; border-radius:3px; background:#5b9dff55; border:1px solid #5b9dffaa; cursor:pointer; overflow:hidden; white-space:nowrap; font-size:11px; padding:0 4px; line-height:18px; }
  .blk:hover { background:#5b9dff88; }
  .blk.sel { background:#4ec98a66; border-color:#4ec98a; }
  .blk.unharmful { opacity:.45; border-style:dashed; }
  .laneLabel { position:absolute; left:0; top:0; height:100%; width:150px; background:linear-gradient(90deg,#1e2128ee,#1e2128aa); font-size:11px; padding:4px 6px; overflow:hidden; white-space:nowrap; pointer-events:none; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { text-align:left; padding:3px 5px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:600; }
  td input, td select { padding:2px 4px; }
  .swatch { width:12px; height:12px; border-radius:3px; display:inline-block; vertical-align:-1px; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="工坊出怪设计器">工坊出怪设计器</h1>
  <span class="dim" id="rootPath"></span>
  <span class="row" style="margin-left:auto">
    <a href="./index.html" data-i18n="干员编辑器">干员编辑器</a>
    <a href="./stage.html" data-i18n="地图设计器">地图设计器</a>
    <a href="./enemy.html" data-i18n="怪物编辑器">怪物编辑器</a>
    <a href="./item.html" data-i18n="装备编辑器">装备编辑器</a>
    <a href="./kit.html" data-i18n="kit 编辑器">kit 编辑器</a>
    <a href="./voice.html" data-i18n="语音编辑器">语音编辑器</a>
    <a href="./pack.html" data-i18n="包管理">包管理</a>
    <button id="btnReload" class="ghost" data-i18n="重新载入">重新载入</button>
    <button id="btnNew" class="ghost" data-i18n="新建出怪表">新建出怪表</button>
  </span>
</header>
<main>
  <aside>
    <div class="item" style="cursor:default"><div class="m" data-i18n="工坊包 / 出怪表">工坊包 / 出怪表</div></div>
    <div id="list"></div>
  </aside>
  <div class="center">
    <div class="row" style="margin-bottom:8px">
      <label style="margin:0" data-i18n="看哪张地图的路线">看哪张地图的路线</label>
      <select id="mapPick" style="width:auto;min-width:220px"></select>
      <button id="ovPaths" class="ghost" data-i18n="显示路线">显示路线</button>
      <span class="dim" id="mapInfo"></span>
    </div>
    <canvas id="board" width="672" height="340"></canvas>
    <h2 data-i18n="时间轴（横轴 = 秒）">时间轴（横轴 = 秒）</h2>
    <div class="tl" id="tl"></div>
    <p class="hint" data-i18n="每条泳道 = 一次出怪。点击方块选中后可改时间/数量/间隔/路线；拖动不改数值，用右侧表格精确编辑。">每条泳道 = 一次出怪。点击方块选中后可改时间/数量/间隔/路线；拖动不改数值，用右侧表格精确编辑。</p>
    <h2 data-i18n="出怪明细">出怪明细</h2>
    <div id="table"></div>
  </div>
  <div class="side" id="side"></div>
</main>
<script type="module" src="./wave.js"></script>
</body>
</html>
