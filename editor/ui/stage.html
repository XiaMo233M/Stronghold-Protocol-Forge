<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卫戍协议 · 工坊地图设计器</title>
<style>
  :root { color-scheme: dark; --bg:#16181d; --panel:#1e2128; --line:#2e333d; --fg:#e8eaf0; --dim:#9aa3b2; --acc:#5b9dff; --ok:#4ec98a; --warn:#e0b357; --err:#f0736b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.6 "Segoe UI", system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  header h1 { font-size:14px; margin:0; font-weight:600; }
  a { color:var(--acc); }
  main { display:grid; grid-template-columns:210px 1fr 320px; gap:0; height:calc(100vh - 47px); }
  aside, .side { overflow:auto; }
  aside { border-right:1px solid var(--line); }
  .side { border-left:1px solid var(--line); padding:12px 14px 60px; }
  .center { overflow:hidden; padding:14px 16px 14px; display:flex; flex-direction:column; min-width:0; }
  /* 画布视口：整张图必须一眼看得见，所以这里是一个**跟窗口长高的盒子**，两张画布都绝对定位铺满它，
     由 JS（stage.js resizeBoard / stage3d.js resize）按盒子的实测尺寸去定备位图大小 —— 不再有写死的 672×608。 */
  .stage-view { position:relative; flex:1 1 auto; min-height:200px; margin:8px 0; overflow:hidden; border-radius:6px; }
  .stage-view canvas { position:absolute; inset:0; width:100%; height:100%; margin:0; border:1px solid var(--line); border-radius:6px; }
  /* 缩放的交互都在 JS 自己的指针/滚轮处理里（触屏上双指缩放也要它自己接管），所以关掉浏览器的手势与双击放大 */
  #board { touch-action:none; }
  #board3d { touch-action:none; }
  h2 { font-size:12px; margin:16px 0 8px; color:var(--dim); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  label { display:block; font-size:12px; color:var(--dim); margin-bottom:2px; }
  input, select, button { font:inherit; color:var(--fg); background:#12141a; border:1px solid var(--line); border-radius:5px; padding:4px 7px; width:100%; }
  button { width:auto; cursor:pointer; background:#262b34; }
  button:hover { border-color:var(--acc); }
  button.primary { background:var(--acc); border-color:var(--acc); color:#08111f; font-weight:600; }
  button.ghost { background:transparent; }
  button.on { border-color:var(--acc); background:#22304a; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .item { padding:7px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:hover { background:#232833; }
  .item.on { background:#22304a; }
  .item .n { font-weight:600; }
  .item .m { color:var(--dim); font-size:12px; }
  .tag { display:inline-block; font-size:11px; padding:0 6px; border-radius:9px; border:1px solid var(--line); color:var(--dim); }
  .tag.err { color:var(--err); border-color:#5f312e; }
  .tag.ok { color:var(--ok); border-color:#2c5a44; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:10px 12px; margin:10px 0; }
  .palette { display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:6px; }
  .sw { display:flex; align-items:center; gap:6px; padding:4px 6px; border:1px solid var(--line); border-radius:5px; cursor:pointer; font-size:12px; }
  .sw.on { border-color:var(--acc); background:#22304a; }
  .sw i { width:14px; height:14px; border-radius:3px; display:inline-block; border:1px solid #00000055; }
  canvas { background:#0f1116; cursor:crosshair; image-rendering:pixelated; }
  .issues { margin:0; padding-left:18px; } .issues li { margin:2px 0; }
  .err { color:var(--err); } .warn { color:var(--warn); } .ok { color:var(--ok); } .dim { color:var(--dim); }
  .banner { padding:7px 11px; border-radius:6px; margin-bottom:8px; }
  .banner.bad { background:#3a1f1e; border:1px solid #5f312e; }
  .banner.good { background:#1c3229; border:1px solid #2c5a44; }
  .hint { color:var(--dim); font-size:12px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .dev { display:grid; grid-template-columns:1fr 64px 26px; gap:5px; margin-bottom:5px; align-items:center; }
  /* 地块图例的一行：字符 / tileKey / 高度 / 可部署 / 通行 / 结论（结论是推导出来的，不可编辑） */
  .legend { display:grid; grid-template-columns:34px 1fr; gap:4px 8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); }
  .legend .lg { font:600 13px/1.2 monospace; text-align:center; border:1px solid var(--line); border-radius:4px; padding:3px 0; }
  .legend .lg.air { border-style:dashed; color:var(--dim); }
  .legend .lrow { display:grid; grid-template-columns:auto 1fr; gap:4px 6px; align-items:center; }
  .legend .lrow > span { color:var(--dim); font-size:11px; }
  .legend .lrow select { padding:2px 4px; }
  .legend .concl { grid-column:1 / -1; }
  .legend .key { color:var(--dim); font:11px/1.4 monospace; word-break:break-all; }
  details.fold { margin:10px 0; }
  details.fold > summary { cursor:pointer; font-size:12px; color:var(--dim); font-weight:600; text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="工坊地图设计器">工坊地图设计器</h1>
  <span class="dim" id="rootPath"></span>
  <span class="row" style="margin-left:auto">
    <a href="./index.html">← <span data-i18n="干员编辑器">干员编辑器</span></a>
    <a href="./enemy.html" data-i18n="怪物编辑器">怪物编辑器</a>
    <a href="./wave.html" data-i18n="出怪设计器">出怪设计器</a>
    <a href="./item.html" data-i18n="装备编辑器">装备编辑器</a>
    <a href="./bond.html" data-i18n="盟约编辑器">盟约编辑器</a>
    <a href="./kit.html" data-i18n="kit 编辑器">kit 编辑器</a>
    <a href="./voice.html" data-i18n="语音编辑器">语音编辑器</a>
    <a href="./pack.html" data-i18n="包管理">包管理</a>
    <button id="btnReload" class="ghost" data-i18n="重新载入">重新载入</button>
    <button id="btnNew" class="ghost" data-i18n="新建地图">新建地图</button>
  </span>
</header>
<main>
  <aside>
    <div class="item" style="cursor:default"><div class="m" data-i18n="工坊包 / 地图">工坊包 / 地图</div></div>
    <div id="list"></div>
  </aside>
  <div class="center">
    <div class="row" style="margin-bottom:8px">
      <button id="toolBrush" class="on" data-i18n="画笔">画笔</button>
      <button id="toolDevice" data-i18n="放装置">放装置</button>
      <button id="toolErase" data-i18n="擦除">擦除</button>
      <button id="toolRoute" data-i18n="画路线">画路线</button>
      <span style="flex:1"></span>
      <button id="ovRoutes" class="on" data-i18n="显示路线">显示路线</button>
      <button id="ovDeploy" class="on" data-i18n="显示部署区">显示部署区</button>
      <button id="ovPaths" data-i18n="显示寻路">显示寻路</button>
    </div>
    <div class="row" style="margin-bottom:8px">
      <!-- 视图工具条：整张图必须一眼看得见，所以「适应」是复位到 fit-to-view 的那一下 -->
      <button id="ov3d" data-i18n="3D 预览">3D 预览</button>
      <span style="flex:1"></span>
      <button id="viewFit" class="ghost" data-i18n="适应">适应</button>
      <button id="viewOut" class="ghost" data-i18n="－">－</button>
      <span class="hint" id="zoomPct" style="min-width:46px;text-align:center">100%</span>
      <button id="viewIn" class="ghost" data-i18n="＋">＋</button>
      <!-- 业主口径：绝不自动生成；只有点这一下才算。 -->
      <button id="btnAutoRoute" data-i18n="自动寻路">自动寻路</button>
    </div>
    <div class="stage-view" id="stageView">
      <canvas id="board" width="672" height="608" tabindex="0"></canvas>
      <!-- 3D 画布没有写死的尺寸：它绝对定位铺满这个盒子，由 stage3d.js 按盒子实测尺寸定备位图 -->
      <canvas id="board3d" hidden></canvas>
    </div>
    <div class="row" id="presets3d" hidden style="margin:0 0 6px"></div>
    <p class="hint" id="hint3d"></p>
    <p class="hint" id="cursor" data-i18n="把鼠标移到网格上看坐标。row 0 在最下面一行（和引擎一致）。">把鼠标移到网格上看坐标。row 0 在最下面一行（和引擎一致）。</p>
    <p class="hint" data-i18n="缩放平移：滚轮 / 双指缩放，中键拖或按住空格拖平移，「适应」复位。">缩放平移：滚轮 / 双指缩放，中键拖或按住空格拖平移，「适应」复位。</p>
    <div class="panel">
      <h2 style="margin-top:0" data-i18n="地形调色板">地形调色板</h2>
      <div class="palette" id="palette"></div>
    </div>
  </div>
  <div class="side" id="side"></div>
</main>
<script type="module" src="./stage.js"></script>
</body>
</html>
