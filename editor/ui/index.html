<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卫戍协议 · 创意工坊编辑器</title>
<style>
  :root { color-scheme: dark; --bg:#16181d; --panel:#1e2128; --line:#2e333d; --fg:#e8eaf0; --dim:#9aa3b2; --acc:#5b9dff; --ok:#4ec98a; --warn:#e0b357; --err:#f0736b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.6 "Segoe UI", system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:14px; margin:0; font-weight:600; }
  header .root { color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns:280px 1fr; gap:0; height:calc(100vh - 47px); }
  aside { border-right:1px solid var(--line); overflow:auto; }
  section { overflow:auto; padding:16px 20px 60px; }
  h2 { font-size:13px; margin:18px 0 8px; color:var(--dim); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px 12px; }
  label { display:block; font-size:12px; color:var(--dim); margin-bottom:2px; }
  input, select, textarea, button { font:inherit; color:var(--fg); background:#12141a; border:1px solid var(--line); border-radius:5px; padding:5px 8px; width:100%; }
  textarea { min-height:64px; resize:vertical; }
  button { width:auto; cursor:pointer; background:#262b34; }
  button:hover { border-color:var(--acc); }
  button.primary { background:var(--acc); border-color:var(--acc); color:#08111f; font-weight:600; }
  button.ghost { background:transparent; }
  .item { padding:8px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:hover { background:#232833; }
  .item.on { background:#22304a; }
  .item .n { font-weight:600; }
  .item .m { color:var(--dim); font-size:12px; }
  .tag { display:inline-block; font-size:11px; padding:0 6px; border-radius:9px; border:1px solid var(--line); color:var(--dim); }
  .tag.ok { color:var(--ok); border-color:#2c5a44; }
  .tag.warn { color:var(--warn); border-color:#5c4a24; }
  .tag.err { color:var(--err); border-color:#5f312e; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:12px 14px; margin:10px 0; }
  .issues { margin:0; padding-left:18px; }
  .issues li { margin:2px 0; }
  .err { color:var(--err); } .warn { color:var(--warn); } .ok { color:var(--ok); } .dim { color:var(--dim); }
  pre { background:#12141a; border:1px solid var(--line); border-radius:6px; padding:10px; overflow:auto; max-height:260px; font-size:12px; }
  .hint { color:var(--dim); font-size:12px; }
  .kv { display:grid; grid-template-columns:1fr 110px 32px; gap:6px; margin-bottom:6px; }
  .split { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .banner { padding:8px 12px; border-radius:6px; margin-bottom:10px; }
  .banner.bad { background:#3a1f1e; border:1px solid #5f312e; }
  .banner.good { background:#1c3229; border:1px solid #2c5a44; }
</style>
</head>
<body>
<header>
  <h1>卫戍协议 · 创意工坊编辑器</h1>
  <span class="root" id="rootPath"></span>
  <span class="row" style="margin-left:auto">
    <a href="./stage.html" style="color:var(--acc)">地图设计器 →</a>
    <a href="./enemy.html" style="color:var(--acc)">怪物编辑器 →</a>
    <a href="./wave.html" style="color:var(--acc)">出怪设计器 →</a>
    <button id="btnReload" class="ghost">重新载入</button>
    <button id="btnNewPack" class="ghost">新建工坊包</button>
  </span>
</header>
<main>
  <aside>
    <div class="item" style="cursor:default"><div class="m">工坊包</div></div>
    <div id="packList"></div>
    <div class="item" style="cursor:default"><div class="m">干员</div></div>
    <div id="opList"></div>
  </aside>
  <section id="editor">
    <p class="hint">正在载入…</p>
  </section>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
