<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卫戍协议 · 工坊 kit（行为层）编辑器</title>
<style>
  :root { color-scheme: dark; --bg:#16181d; --panel:#1e2128; --line:#2e333d; --fg:#e8eaf0; --dim:#9aa3b2; --acc:#5b9dff; --ok:#4ec98a; --warn:#e0b357; --err:#f0736b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.6 "Segoe UI", system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  header h1 { font-size:14px; margin:0; font-weight:600; }
  a { color:var(--acc); }
  main { display:grid; grid-template-columns:250px 1fr 340px; height:calc(100vh - 47px); }
  aside, .side, .center { overflow:auto; }
  aside { border-right:1px solid var(--line); }
  .side { border-left:1px solid var(--line); padding:12px 14px 60px; }
  .center { padding:14px 16px 60px; display:flex; flex-direction:column; }
  h2 { font-size:12px; margin:16px 0 8px; color:var(--dim); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  h2:first-child { margin-top:0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  label { display:block; font-size:12px; color:var(--dim); margin-bottom:2px; }
  input, select, textarea, button { font:inherit; color:var(--fg); background:#12141a; border:1px solid var(--line); border-radius:5px; padding:4px 7px; width:100%; }
  button { width:auto; cursor:pointer; background:#262b34; }
  button:hover { border-color:var(--acc); }
  button.primary { background:var(--acc); border-color:var(--acc); color:#08111f; font-weight:600; }
  button.ghost { background:transparent; }
  /* the whole point of this page: the FILE. A plain textarea — code needs no highlighting to be editable. */
  #src { flex:1; min-height:340px; font-family:ui-monospace, monospace; font-size:12.5px; line-height:1.55; white-space:pre; overflow:auto; tab-size:2; }
  .item { padding:7px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:hover { background:#232833; }
  .item.on { background:#22304a; }
  .item .n { font-weight:600; }
  .item .m { color:var(--dim); font-size:12px; }
  .tag { display:inline-block; font-size:11px; padding:0 6px; border-radius:9px; border:1px solid var(--line); color:var(--dim); }
  .tag.err { color:var(--err); border-color:#5f312e; }
  .tag.warn { color:var(--warn); border-color:#5a4a22; }
  .tag.ok { color:var(--ok); border-color:#2c5a44; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:10px 12px; margin:10px 0; }
  .err { color:var(--err); } .warn { color:var(--warn); } .ok { color:var(--ok); } .dim { color:var(--dim); }
  .banner { padding:7px 11px; border-radius:6px; margin-bottom:8px; }
  .banner.bad { background:#3a1f1e; border:1px solid #5f312e; }
  .banner.good { background:#1c3229; border:1px solid #2c5a44; }
  .hint { color:var(--dim); font-size:12px; }
  .derived { font-family:ui-monospace, monospace; white-space:pre-wrap; }
  .chip { display:inline-block; font-family:ui-monospace, monospace; font-size:11.5px; padding:1px 6px; margin:2px 4px 2px 0; border:1px solid var(--line); border-radius:9px; cursor:pointer; color:var(--dim); }
  .chip:hover { border-color:var(--acc); color:var(--fg); }
  code { font-family:ui-monospace, monospace; font-size:12px; color:var(--fg); background:#12141a; padding:0 3px; border-radius:3px; }
  ol.rules { margin:6px 0 0; padding-left:18px; }
  ol.rules li { margin-bottom:6px; }
  details { margin-top:8px; }
  summary { cursor:pointer; color:var(--dim); font-size:12px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="工坊 kit（行为层）编辑器">工坊 kit（行为层）编辑器</h1>
  <span class="dim" id="rootPath"></span>
  <span class="row" style="margin-left:auto">
    <a href="./index.html" data-i18n="干员编辑器">干员编辑器</a>
    <a href="./stage.html" data-i18n="地图设计器">地图设计器</a>
    <a href="./enemy.html" data-i18n="怪物编辑器">怪物编辑器</a>
    <a href="./wave.html" data-i18n="出怪设计器">出怪设计器</a>
    <a href="./item.html" data-i18n="装备编辑器">装备编辑器</a>
    <a href="./bond.html" data-i18n="盟约编辑器">盟约编辑器</a>
    <a href="./voice.html" data-i18n="语音编辑器">语音编辑器</a>
    <a href="./pack.html" data-i18n="包管理">包管理</a>
    <button id="btnReload" class="ghost" data-i18n="重新载入">重新载入</button>
    <button id="btnNew" class="ghost" data-i18n="新建 kit">新建 kit</button>
  </span>
</header>
<main>
  <aside>
    <div class="item" style="cursor:default"><div class="m" data-i18n="工坊包 / kit">工坊包 / kit</div></div>
    <div id="list"></div>
  </aside>
  <div class="center" id="editor"></div>
  <div class="side" id="side"></div>
</main>
<!-- 这一页自己不许 import（test/kitEditor.test.js 钉着）：先由这个模块把 i18n 接口挂到 globalThis.spI18n，
     模块脚本按文档顺序执行，所以 kit.js 跑的时候它一定已经挂好了。 -->
<script type="module" src="./i18n.global.js"></script>
<script type="module" src="./kit.js"></script>
</body>
</html>
