<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">
  <rect x="0" y="0" width="680" height="340" fill="#ffffff"/>

  <rect x="16" y="16" width="648" height="48" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="42" cy="40" r="13" fill="#ddf4ff" stroke="#0969da"/>
  <text x="42" y="44" font-size="12" fill="#0969da" text-anchor="middle">1</text>
  <text x="66" y="34" font-size="13" fill="#1f2328">写：pack.json 加它点名的文件</text>
  <text x="66" y="53" font-size="12" fill="#57606a">顶层键 35 个闭集；不认识的键点名拒绝，绝不读过去</text>

  <line x1="340" y1="64" x2="340" y="78" stroke="#8c959f" stroke-width="1.5"/>
  <polygon points="336,76 344,76 340,84" fill="#8c959f"/>

  <rect x="16" y="84" width="648" height="48" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="42" cy="108" r="13" fill="#ddf4ff" stroke="#0969da"/>
  <text x="42" y="112" font-size="12" fill="#0969da" text-anchor="middle">2</text>
  <text x="66" y="102" font-size="13" fill="#1f2328">装载：形状 → 闭枚举 → 真实引擎</text>
  <text x="66" y="121" font-size="12" fill="#57606a">每条拒绝码都点名；声明了引擎不认识的东西是整包拒，不是忽略</text>

  <line x1="340" y1="132" x2="340" y2="146" stroke="#8c959f" stroke-width="1.5"/>
  <polygon points="336,144 344,144 340,152" fill="#8c959f"/>

  <rect x="16" y="152" width="648" height="48" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="42" cy="176" r="13" fill="#ddf4ff" stroke="#0969da"/>
  <text x="42" y="180" font-size="12" fill="#0969da" text-anchor="middle">3</text>
  <text x="66" y="170" font-size="13" fill="#1f2328">跑起来：内容叠加 · 面板挂 9 槽位 · 服务端 6 用途 · 包通道</text>
  <text x="66" y="189" font-size="12" fill="#57606a">包给不出数值，也给不出路径；动作由引擎自己构造</text>

  <line x1="340" y1="200" x2="340" y2="214" stroke="#8c959f" stroke-width="1.5"/>
  <polygon points="336,212 344,212 340,220" fill="#8c959f"/>

  <rect x="16" y="220" width="648" height="48" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="42" cy="244" r="13" fill="#ddf4ff" stroke="#0969da"/>
  <text x="42" y="248" font-size="12" fill="#0969da" text-anchor="middle">4</text>
  <text x="66" y="238" font-size="13" fill="#1f2328">同步：GET /mods/catalog.json，再按 sha256 拉文件</text>
  <text x="66" y="257" font-size="12" fill="#57606a">客户端用服务端同一个摘要算法重建包哈希；先验哈希再落盘</text>

  <line x1="340" y1="268" x2="340" y2="282" stroke="#8c959f" stroke-width="1.5"/>
  <polygon points="336,280 344,280 340,288" fill="#8c959f"/>

  <rect x="16" y="288" width="648" height="48" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <circle cx="42" cy="312" r="13" fill="#ffffff" stroke="#1a7f37"/>
  <text x="42" y="316" font-size="12" fill="#1a7f37" text-anchor="middle">5</text>
  <text x="66" y="306" font-size="13" fill="#1f2328">分发：导出 .zip · 投稿站 · mods/ 仓库</text>
  <text x="66" y="325" font-size="12" fill="#57606a">站点只认 zip 根；mods/index.json 是 mod 仓库的唯一真相</text>
</svg>
