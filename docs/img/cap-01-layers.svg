<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" width="680" height="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">
  <rect x="0" y="0" width="680" height="372" fill="#ffffff"/>

  <rect x="16" y="16" width="104" height="60" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="68" y="52" font-size="13" fill="#0969da" text-anchor="middle">上游游戏</text>
  <rect x="136" y="16" width="528" height="60" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="152" y="38" font-size="13" fill="#1f2328">创作对象 · 本仓库一并附带</text>
  <text x="152" y="60" font-size="12" fill="#57606a">战斗模拟 · 对局与商店 · 渲染与界面（上游 0.2.5）</text>

  <rect x="16" y="88" width="104" height="100" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="68" y="132" font-size="13" fill="#1a7f37" text-anchor="middle">mod 层</text>
  <text x="68" y="152" font-size="11" fill="#57606a" text-anchor="middle">包只能碰这里</text>
  <rect x="136" y="88" width="528" height="100" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="152" y="112" font-size="13" fill="#1f2328">包能声明的全部（35 键闭集）</text>
  <text x="152" y="134" font-size="12" fill="#57606a">content / overrides 内容与官方记录覆盖 · client.panels 9 槽位</text>
  <text x="152" y="155" font-size="12" fill="#57606a">server.modules 6 用途 · 4 个可 wrap 组件 · messages · routes</text>
  <text x="152" y="176" font-size="12" fill="#57606a">variants 三轴 · behaviour 4 格 · target · 依赖与互斥 · notices</text>

  <rect x="16" y="200" width="104" height="60" rx="8" fill="#fff8c5" stroke="#9a6700"/>
  <text x="68" y="236" font-size="13" fill="#9a6700" text-anchor="middle">编辑器</text>
  <rect x="136" y="200" width="528" height="60" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="152" y="222" font-size="13" fill="#1f2328">Forge 工坊编辑器 · 独立分发</text>
  <text x="152" y="244" font-size="12" fill="#57606a">9 页 · 校验器复用真实引擎 · 一键试玩 SP_WORKSHOP</text>

  <rect x="16" y="272" width="104" height="60" rx="8" fill="#f3e8ff" stroke="#8250df"/>
  <text x="68" y="308" font-size="13" fill="#8250df" text-anchor="middle">分发</text>
  <rect x="136" y="272" width="528" height="60" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="152" y="294" font-size="13" fill="#1f2328">从一份 pack.json 到别人装上它</text>
  <text x="152" y="316" font-size="12" fill="#57606a">标准包规范 → mod 仓库（条数以 index.json 为准）→ 投稿站</text>

  <text x="16" y="356" font-size="12" fill="#57606a">包只能消费 mod 层已有的通道；要新能力就先在引擎侧加一刀，包才可能声明它。</text>
</svg>
